# Serviços auxiliares que não fazem parte do app NestJS (`npm run start:dev`) nem do
# Supabase local (`npx supabase start`, stack própria). Calculadores RTC da RFB -- ver
# docker/rtc-*/README.md pra buildar cada imagem antes do primeiro `up`.
services:
  rtc-simples-nacional:
    image: jota-rtc-simples-nacional:latest
    ports:
      - '8082:8082'
    restart: unless-stopped

  rtc-regime-regular:
    image: jota-rtc-regime-regular:latest
    ports:
      - '8080:8080'
    restart: unless-stopped

  rtc-gerador-danfse:
    image: jota-rtc-gerador-danfse:latest
    ports:
      - '8081:8080'
    restart: unless-stopped
